<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#cbb88c;--pan:#ecdcb4;--ink:#2a1c0c;--gold:#7a4d0b;--edge:#8b5e1f;--mk:#c4161c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0a08;--pan:#1b1510;--ink:#e9dcbc;--gold:#f0c250;--edge:#6b4d1f;--mk:#ff4b3e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0a08;--pan:#1b1510;--ink:#e9dcbc;--gold:#f0c250;--edge:#6b4d1f;--mk:#ff4b3e;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 1rem/1.4 "Alegreya Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:12;background:var(--bg)}
[hidden]{display:none!important}
a{color:var(--gold)}
header{position:relative;text-align:center;padding:1.4rem 1rem .8rem}
#th{position:absolute;top:.5rem;right:.6rem;width:2.66rem;height:2.66rem;border:0;border-radius:50%;background:transparent;color:var(--gold);font-size:1.46rem;line-height:1;cursor:pointer;opacity:.55}
#th:hover,#th:focus-visible{opacity:1;background:rgba(127,127,127,.2)}
h1{margin:0;font:600 clamp(2.2rem,8vw,3.4rem)/1.1 Cinzel,Georgia,serif;color:var(--gold);letter-spacing:.08em}
h1::after{content:"";display:block;width:4rem;height:2px;margin:.6rem auto 0;background:var(--edge)}
.sub{margin-top:.4rem;font-size:1.05rem}
#cd{font-weight:700;color:var(--gold)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;padding:.5rem .8rem;background:var(--bg);border-bottom:2px solid var(--edge)}
#chips{display:flex;flex-wrap:wrap;gap:.4rem}
nav input{flex:1 1 140px;min-width:0;padding:.4rem .6rem;border:1px solid var(--edge);border-radius:4px;background:var(--pan);color:var(--ink);font:inherit}
nav button,#chips a{font:600 .8rem Cinzel,Georgia,serif;padding:.4rem .7rem;border:1px solid var(--edge);border-radius:4px;background:var(--pan);color:var(--gold);cursor:pointer;text-decoration:none}
nav button.on{background:var(--mk);color:#fff}
main{max-width:860px;margin:0 auto;padding:1rem .8rem 3rem;display:grid;gap:1rem}
section{background:var(--pan);border:2px solid var(--edge);border-radius:6px;box-shadow:inset 0 0 0 3px var(--pan),inset 0 0 0 4px var(--edge),0 4px 14px rgba(0,0,0,.35)}
h2{margin:0;padding:.7rem 1rem;display:flex;justify-content:space-between;align-items:center;font:800 1.15rem Cinzel,Georgia,serif;letter-spacing:.04em;color:var(--gold);cursor:pointer;border-bottom:1px solid var(--edge)}
h2 .n{font:500 .85rem "Alegreya Sans",sans-serif;opacity:.8}
.body{padding:.6rem 1rem 1rem}
section.c .body{display:none}
.it{display:flex;gap:.55rem;padding:.2rem 0}
.d1{margin-left:1.2rem}.d2{margin-left:2.4rem}.d3{margin-left:3.6rem}
.it::before{content:"◆";flex:none;color:var(--edge);font-size:.6rem;margin-top:.4rem}
.grp{font-weight:700}
.it.mk::before{content:"!";font:800 1.5rem/1 Cinzel,Georgia,serif;color:var(--mk);margin-top:.05rem;text-shadow:0 0 8px var(--mk)}
.ck::before,.nb::before{display:none}
.pic{display:block;width:100%;height:auto}
.dg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.3rem .5rem;margin-top:.6rem}
.dr a{color:inherit;text-decoration:none}
.dr a:hover{color:var(--gold)}
.dr.tc{color:#fff}
.dr.tc .lv{color:inherit;border-color:currentColor}
.dr.tc a:hover{color:inherit;text-decoration:underline}
@media (max-width:620px){.dg{grid-template-columns:1fr}}
.dr{display:flex;align-items:center;gap:.6rem;padding:.3rem .6rem;border-radius:5px;background:rgba(127,127,127,.12);font-weight:700}
.dr .lv{width:auto;height:auto;padding:.05rem .55rem;border-width:1px;border-radius:999px;font-size:.78rem;white-space:nowrap}
.cb{font:700 .72rem system-ui,sans-serif;margin-left:.5rem;padding:.2rem .6rem;border:0;border-radius:3px;background:var(--edge);color:#fff;cursor:pointer}
.cb.ok{background:#2f7d32}
.ck input{flex:none;margin-top:.3rem;accent-color:var(--mk)}
.done span{text-decoration:line-through;opacity:.55}
.emb{display:block;width:100%;border:1px solid var(--edge);border-radius:6px;background:#0c0a08}
.wt{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.6rem;font-size:.9rem}
.wt button{font:600 .75rem Cinzel,Georgia,serif;padding:.3rem .65rem;border:1px solid var(--edge);border-radius:4px;background:var(--pan);color:var(--gold);cursor:pointer}
.wt button.on{background:var(--mk);color:#fff}
.wl{display:grid;gap:.45rem}
.dh{margin-left:auto;padding-right:calc(.7rem + 1px);font:600 .72rem Cinzel,Georgia,serif;color:var(--gold)}
.wl.ho .opt{display:none}

## 💡 Tips
- Professions:
  - Herbalism + Skinning
    - Herbalism + Mining ruins Plainsrunning too much
    - Bank or mail all mats unless urgently needed
  ! Get ahead on professions in the starting zone
  - Don’t go Engi for launch: SAF-T has no Engi requirement
! Buy skills in Moonglade before using HS
- Green mobs are nerfed, but can be worth it for quest rewards, especially at low levels
  ! Fight mobs of your own level early on
- Don’t worry about gear, and don’t buy gear from the AH
  - Cheap weapons can be worth it
  - Check sharpening and weightstones on the AH
- Weapon speed and damage range don’t matter in form, only DPS
- Camping is worth it and gives 1-minute irl breaks
- Food for 5% XP:
  - **Lv 1** {{Small Egg|6889}} -> {{Herb Baked Egg|6888}} (auto learned or trainer)
  - **Lv 10** {{Stringy Wolf Meat|2672}} + Mild Spices -> {{Spiced Wolf Meat|2680}} (trainer: [Pyall Silentstride](https://www.wowhead.com/forever/npc=3067/pyall-silentstride), Mulgore)
  - **Lv 25** {{Kodo Meat|5467}} + Mild Spices -> {{Roasted Kodo Meat|5474}} (recipe: [Wunna Darkmane](https://www.wowhead.com/forever/npc=3081/wunna-darkmane), Mulgore)
  - **Lv 45** {{Chunk of Boar Meat|769}} -> {{Roasted Boar Meat|2681}} (auto learned or trainer)
  - **Lv 50** {{Coyote Meat|2673}} -> {{Coyote Steak|2684}} (trainer: [Pyall Silentstride](https://www.wowhead.com/forever/npc=3067/pyall-silentstride), Mulgore)
- Always buy max-rank water (and optionally food)
- Logout skip via [website](https://eu.support.blizzard.com/en/help/product/wow/197/834/solution) (1-hour cooldown)
- Tempoing out mana and eating/drinking is usually faster than sustaining mana for slower kills
- Grind after a big weapon upgrade, quest when weaker
  - Grind spots: Ravenhill Cemetery, 1K Needles centaurs, Swamp of Sorrows jaguars and crocs [WIP]
- Ghetto hearth now teleports you to the nearest graveyard and doesn’t put your HS on cooldown
  - Enables time saves i.e. after a dungeons run (WC to Crossroads while saving HS cd)
! Reagent Bags
  - Herb Pouch (12-slot herb bag) from [Zeal’aya](https://www.wowhead.com/forever/npc=3405/zealaya) in Orgrimmar, 10s
  - Spidersilk Sack (10-slot reagent bag) from [Stronger than Steel](https://www.wowhead.com/forever/quest=96260/stronger-than-steel) in Mulgore (new zone, level ~25-30)
